# Backend-only CD is retired. This read-only configuration also makes
# existing legacy triggers harmless until trigger reconciliation removes them.
# Deploy both UI stacks through ui-frontend-services-cloud-build-cd.yaml.
substitutions:
  _LOCATION: us-central1
  _REPO_NAME: mcp-servers
steps:
- name: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  id: ui-regressions
  args:
  - -ec
  - uv run --group backend --group frontend --group dev pytest ui/tests terraform/tests
    -q
  entrypoint: sh
- name: hashicorp/terraform:1.12.2
  id: ui_backend-init
  args:
  - -ec
  - terraform init -backend-config="bucket=${PROJECT_ID}-terraform-state" -backend-config="prefix=terraform/state/ui-backend-resources"
  dir: terraform/ui_backend_resources
  entrypoint: sh
- name: hashicorp/terraform:1.12.2
  id: backend-fmt
  args:
  - fmt
  - -check
  dir: terraform/ui_backend_resources
- name: hashicorp/terraform:1.12.2
  id: backend-validate
  args:
  - validate
  dir: terraform/ui_backend_resources
- name: gcr.io/cloud-builders/docker
  id: backend-build
  args:
  - build
  - -t
  - ${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/ui-backend:${COMMIT_SHA}
  - -f
  - ui/backend/Dockerfile
  - .
serviceAccount: projects/${PROJECT_ID}/serviceAccounts/${_SA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
