substitutions:
  _REGION: "us-central1"
  _AGENT_DISPLAY_NAME: "OSIRIS - Test"
  _MODEL_ARMOR_TEMPLATE_ID: "security-template"
  _AGENT_SA: "adk-agent"
  _METRICS_DATASET_ID: "agent_metrics"
  _METRICS_TABLE_ID: "response_times"
  _REGISTER_AGENT_IN_GE: "false"
  _GE_REGION: "global"
  _GE_APP_NAME_SUFFIX: "osiris-app"
  _GE_AGENT_DESCRIPTION: "A hierarchical multi-agent system designed to break information silos and search across enterprise data sources."
  _GOOGLE_OAUTH_SCOPES: "openid email https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/bigquery https://www.googleapis.com/auth/cloud-platform https://www.googleapis.com/auth/calendar.events.readonly https://www.googleapis.com/auth/meetings.space.readonly"
  _MICROSOFT_OAUTH_SCOPES: "openid offline_access Files.Read.All Sites.Read.All User.Read Mail.Read email Calendars.Read"
  # _ATLASSIAN_OAUTH_SCOPES: "offline_access read:jira-work read:jira-user read:space:confluence read:page:confluence read:attachment:confluence read:comment:confluence read:label:confluence search:confluence"
  _MICROSOFT_TENANT_ID: "93f8f3d2-54f6-417d-9a37-10ff2952f228"
  _GEMINI_GOOGLE_AUTH_ID: "google-workspace-authentication-test-v2"
  _GEMINI_MICROSOFT_AUTH_ID: "microsoft-entra-authentication-test-v2"
  # _GEMINI_ATLASSIAN_AUTH_ID: "atlassian-authentication-test-v2"

steps:
  # Step 1: Initialize Terraform with Dynamic Backend
  - name: 'hashicorp/terraform:1.12.2'
    id: 'tf-init'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        terraform init \
          -backend-config="bucket=${PROJECT_ID}-terraform-state" \
          -backend-config="prefix=terraform/state/ai-agent-resources"
    dir: 'terraform/ai_agent_resources'

  # Step 2: Ensure code is formatted correctly
  - name: 'hashicorp/terraform:1.12.2'
    id: 'tf-fmt'
    args: ['fmt', '-check']
    dir: 'terraform/ai_agent_resources'

  # Step 3: Format Check & Tests (Python)
  - name: 'python:3.12'
    id: 'python-lint-and-tests'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y make git
        pip install uv
        uv sync --group ai-agent --group dev
        make run-agent-precommit
        make test-agent

  # Step 4: Validate the configuration syntax
  - name: 'hashicorp/terraform:1.12.2'
    id: 'tf-validate'
    args: ['validate']
    dir: 'terraform/ai_agent_resources'

  # Step 5: Run Terraform Plan
  - name: 'hashicorp/terraform:1.12.2'
    id: 'tf-plan'
    args:
      - 'plan'
      - '-var=project_id=${PROJECT_ID}'
      - '-var=main_region=${_REGION}'
      - '-out=tfplan'
    dir: 'terraform/ai_agent_resources'

  # Step 6: Run Terraform Apply
  # Creates the required permissions and service accounts to run the agent
  - name: 'hashicorp/terraform:1.12.2'
    id: 'tf-apply'
    args:
      - 'apply'
      - '-var=project_id=${PROJECT_ID}'
      - '-var=main_region=${_REGION}'
      - '-auto-approve'
    dir: 'terraform/ai_agent_resources'
  
  # Step 7: Unregister the agent from GE (Conditional)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'ge-unregister-agent'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${_REGISTER_AGENT_IN_GE}" != "true" ]; then
          echo "Skipping GE agent unregistration (_REGISTER_AGENT_IN_GE is '${_REGISTER_AGENT_IN_GE}')."
          exit 0
        fi
        apt-get update && apt-get install -y jq curl
        chmod +x gemini_enterprise/scripts/ge_manager.sh
        
        echo "Checking and deleting existing agent in GE..."
        ./gemini_enterprise/scripts/ge_manager.sh unregister-agent \
          --project ${PROJECT_ID} \
          --ge-location ${_GE_REGION} \
          --app-id ${PROJECT_ID}-${_GE_REGION}-${_GE_APP_NAME_SUFFIX} \
          --agent-display-name "${_AGENT_DISPLAY_NAME}" || true

  # Step 8: Delete all auth resources (Conditional)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'ge-delete-auth-resources'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${_REGISTER_AGENT_IN_GE}" != "true" ]; then
          echo "Skipping GE auth IDs deletion (_REGISTER_AGENT_IN_GE is '${_REGISTER_AGENT_IN_GE}')."
          exit 0
        fi
        apt-get update && apt-get install -y jq curl
        chmod +x gemini_enterprise/scripts/ge_manager.sh

        echo "Deleting GE Auth IDs ${_GEMINI_GOOGLE_AUTH_ID} and ${_GEMINI_MICROSOFT_AUTH_ID}..."
        ./gemini_enterprise/scripts/ge_manager.sh delete-auth-ids \
          --project ${PROJECT_ID} \
          --ge-location ${_GE_REGION} \
          --auth-ids "${_GEMINI_GOOGLE_AUTH_ID},${_GEMINI_MICROSOFT_AUTH_ID}" || true

  # Step 9: Create new auth resources (Conditional)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'ge-create-auth-resources'
    entrypoint: 'bash'
    secretEnv: ['GOOGLE_OAUTH_CLIENT_ID', 'GOOGLE_OAUTH_CLIENT_SECRET', 'MICROSOFT_OAUTH_CLIENT_ID', 'MICROSOFT_OAUTH_CLIENT_SECRET']
    args:
      - '-c'
      - |
        if [ "${_REGISTER_AGENT_IN_GE}" != "true" ]; then
          echo "Skipping GE auth IDs creation (_REGISTER_AGENT_IN_GE is '${_REGISTER_AGENT_IN_GE}')."
          exit 0
        fi
        apt-get update && apt-get install -y jq curl
        chmod +x gemini_enterprise/scripts/ge_manager.sh

        echo "Creating GE Auth ID for Google: ${_GEMINI_GOOGLE_AUTH_ID}..."
        ./gemini_enterprise/scripts/ge_manager.sh create-auth-ids \
          --project ${PROJECT_ID} \
          --ge-location ${_GE_REGION} \
          --auth-ids "${_GEMINI_GOOGLE_AUTH_ID}" \
          --client-id "$$GOOGLE_OAUTH_CLIENT_ID" \
          --client-secret "$$GOOGLE_OAUTH_CLIENT_SECRET" \
          --scopes "${_GOOGLE_OAUTH_SCOPES}" \
          --auth-uri-base "https://accounts.google.com/o/oauth2/v2/auth" \
          --token-uri "https://oauth2.googleapis.com/token" \
          --auth-uri-extras "include_granted_scopes=true&access_type=offline"

        echo "Creating GE Auth ID for Microsoft: ${_GEMINI_MICROSOFT_AUTH_ID}..."
        ./gemini_enterprise/scripts/ge_manager.sh create-auth-ids \
          --project ${PROJECT_ID} \
          --ge-location ${_GE_REGION} \
          --auth-ids "${_GEMINI_MICROSOFT_AUTH_ID}" \
          --client-id "$$MICROSOFT_OAUTH_CLIENT_ID" \
          --client-secret "$$MICROSOFT_OAUTH_CLIENT_SECRET" \
          --scopes "${_MICROSOFT_OAUTH_SCOPES}" \
          --auth-uri-base "https://login.microsoftonline.com/${_MICROSOFT_TENANT_ID}/oauth2/v2.0/authorize" \
          --token-uri "https://login.microsoftonline.com/${_MICROSOFT_TENANT_ID}/oauth2/v2.0/token" \
          --prompt "select_account"

        # echo "Creating GE Auth ID for Atlassian: ${_GEMINI_ATLASSIAN_AUTH_ID}..."
        # ./gemini_enterprise/scripts/ge_manager.sh create-auth-ids \
        #   --project ${PROJECT_ID} \
        #   --ge-location ${_GE_REGION} \
        #   --auth-ids "${_GEMINI_ATLASSIAN_AUTH_ID}" \
        #   --client-id "$$ATLASSIAN_OAUTH_CLIENT_ID" \
        #   --client-secret "$$ATLASSIAN_OAUTH_CLIENT_SECRET" \
        #   --scopes "${_ATLASSIAN_OAUTH_SCOPES}" \
        #   --auth-uri-base "https://auth.atlassian.com/authorize" \
        #   --token-uri "https://auth.atlassian.com/oauth/token" \
        #   --auth-uri-extras "audience=api.atlassian.com" \
        #   --prompt "consent"

  
  # Step 10: Deploy the AI-Agent to Agent Engine
  - name: 'python:3.12'
    id: 'deploy-agent-engine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -eo pipefail
        pip install uv
        uv export \
          --group ai-agent \
          --no-hashes \
          --no-annotate \
          -o agent/core_agent/requirements.txt

        ENV_VARS="PROJECT_ID=${PROJECT_ID}"
        ENV_VARS="$${ENV_VARS},REGION=${_REGION}"
        ENV_VARS="$${ENV_VARS},LANDING_ZONE_BUCKET=${PROJECT_ID}-ai-agent-landing-zone"
        ENV_VARS="$${ENV_VARS},MODEL_ARMOR_TEMPLATE_ID=${_MODEL_ARMOR_TEMPLATE_ID}"
        
        if [ "${_REGISTER_AGENT_IN_GE}" = "true" ]; then
          ENV_VARS="$${ENV_VARS},GEMINI_GOOGLE_AUTH_ID=${_GEMINI_GOOGLE_AUTH_ID}"
          ENV_VARS="$${ENV_VARS},GEMINI_MICROSOFT_AUTH_ID=${_GEMINI_MICROSOFT_AUTH_ID}"
          # ENV_VARS="$${ENV_VARS},GEMINI_ATLASSIAN_AUTH_ID=${_GEMINI_ATLASSIAN_AUTH_ID}"
        fi
        
        ENV_VARS="$${ENV_VARS},BIGQUERY_URL=http://gateway.mcp.internal/bq"
        ENV_VARS="$${ENV_VARS},DRIVE_URL=http://gateway.mcp.internal/drive"
        ENV_VARS="$${ENV_VARS},GCS_URL=http://gateway.mcp.internal/gcs"
        ENV_VARS="$${ENV_VARS},CALENDAR_URL=http://gateway.mcp.internal/calendar"
        ENV_VARS="$${ENV_VARS},ONEDRIVE_URL=http://gateway.mcp.internal/onedrive"
        ENV_VARS="$${ENV_VARS},ATLASSIAN_URL=http://gateway.mcp.internal/atlassian"
        ENV_VARS="$${ENV_VARS},SHAREPOINT_URL=http://gateway.mcp.internal/sharepoint"
        ENV_VARS="$${ENV_VARS},OUTLOOK_URL=http://gateway.mcp.internal/outlook"
        
        ENV_VARS="$${ENV_VARS},EKB_PIPELINE_URL=http://gateway.mcp.internal/ekb"
        
        # OpenTelemetry & Observability configuration
        ENV_VARS="$${ENV_VARS},OTEL_METRICS_EXPORTER=gcp_monitoring"
        ENV_VARS="$${ENV_VARS},OTEL_TRACES_EXPORTER=gcp_trace"
        ENV_VARS="$${ENV_VARS},OTEL_LOGS_EXPORTER=gcp_logging"
        ENV_VARS="$${ENV_VARS},OTEL_INSTRUMENTATION_GENAI_UPLOAD_FORMAT=jsonl"
        ENV_VARS="$${ENV_VARS},OTEL_INSTRUMENTATION_GENAI_COMPLETION_HOOK=upload"
        ENV_VARS="$${ENV_VARS},OTEL_INSTRUMENTATION_GENAI_UPLOAD_BASE_PATH=gs://${PROJECT_ID}-ai-agent-landing-zone/traces"
        ENV_VARS="$${ENV_VARS},OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true"
        ENV_VARS="$${ENV_VARS},GOOGLE_CLOUD_AGENT_ENGINE_ENABLE_TELEMETRY=true"

        uv run --group ai-agent --group dev python -m agent.deployment.deploy \
          --project ${PROJECT_ID} \
          --location ${_REGION} \
          --display-name "${_AGENT_DISPLAY_NAME}" \
          --source-packages=./agent \
          --entrypoint-module=agent.core_agent.agent \
          --entrypoint-object=app \
          --requirements-file=./agent/core_agent/requirements.txt \
          --service-account=${_AGENT_SA}@${PROJECT_ID}.iam.gserviceaccount.com \
          --min-instances=1 \
          --memory=16Gi \
          --num-workers=4 \
          --set-env-vars="$${ENV_VARS}" 2>&1 | tee deploy_output.txt
        
        grep -o "reasoningEngines/[0-9]*" deploy_output.txt | tail -n 1 | cut -d'/' -f2 > /workspace/adk_resource.txt
        echo "Captured ADK_RESOURCE_ID: $(cat /workspace/adk_resource.txt)"

  # Step 11: Register the Agent in GE (Conditional)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'ge-register-agent'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${_REGISTER_AGENT_IN_GE}" != "true" ]; then
          echo "Skipping GE Agent registration (_REGISTER_AGENT_IN_GE is '${_REGISTER_AGENT_IN_GE}')."
          exit 0
        fi
        apt-get update && apt-get install -y jq curl
        chmod +x gemini_enterprise/scripts/ge_manager.sh
        
        ADK_RESOURCE_ID=$(cat /workspace/adk_resource.txt 2>/dev/null || echo "")

        echo "Registering Agent in GE..."
        ./gemini_enterprise/scripts/ge_manager.sh register-agent \
          --project ${PROJECT_ID} \
          --ge-location ${_GE_REGION} \
          --app-id ${PROJECT_ID}-${_GE_REGION}-${_GE_APP_NAME_SUFFIX} \
          --agent-display-name "${_AGENT_DISPLAY_NAME}" \
          --agent-description "${_GE_AGENT_DESCRIPTION}" \
          --agent-engine-location ${_REGION} \
          --agent-engine-agent-id "$${ADK_RESOURCE_ID}" \
          --auth-ids "${_GEMINI_GOOGLE_AUTH_ID},${_GEMINI_MICROSOFT_AUTH_ID}"

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/GOOGLE_OAUTH_CLIENT_ID/versions/latest
      env: 'GOOGLE_OAUTH_CLIENT_ID'
    - versionName: projects/${PROJECT_ID}/secrets/GOOGLE_OAUTH_CLIENT_SECRET/versions/latest
      env: 'GOOGLE_OAUTH_CLIENT_SECRET'
    - versionName: projects/${PROJECT_ID}/secrets/MICROSOFT_OAUTH_CLIENT_ID/versions/latest
      env: 'MICROSOFT_OAUTH_CLIENT_ID'
    - versionName: projects/${PROJECT_ID}/secrets/MICROSOFT_OAUTH_CLIENT_SECRET/versions/latest
      env: 'MICROSOFT_OAUTH_CLIENT_SECRET'
    # - versionName: projects/${PROJECT_ID}/secrets/ATLASSIAN_OAUTH_CLIENT_ID/versions/latest
    #   env: 'ATLASSIAN_OAUTH_CLIENT_ID'
    # - versionName: projects/${PROJECT_ID}/secrets/ATLASSIAN_OAUTH_CLIENT_SECRET/versions/latest
    #   env: 'ATLASSIAN_OAUTH_CLIENT_SECRET'

# Ensure this Service Account has 'Storage Object Admin' on the state bucket
serviceAccount: 'projects/${PROJECT_ID}/serviceAccounts/${_SA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com'

# Configuration for the build runner
options:
  logging: CLOUD_LOGGING_ONLY
