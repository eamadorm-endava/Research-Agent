substitutions:
  _REGION: "us-central1"
  _NETWORK_NAME: "mcp-agent-vpc"
  _APP_SUBNET_CIDR: "10.10.0.0/24"
  _PROXY_SUBNET_CIDR: "10.129.0.0/23"

steps:
  # Step 1: Initialize Terraform with Dynamic Backend
  - name: 'hashicorp/terraform:1.12.2'
    id: 'tf-init'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        terraform init \
          -backend-config="bucket=${PROJECT_ID}-terraform-state" \
          -backend-config="prefix=terraform/state/agent-gateway-resources"
    dir: 'terraform/agent_gateway_resources'


  - name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:stable'
    id: 'discover-existing-gateway'
    entrypoint: 'bash'
    args:
      - '-ec'
      - >-
        python3 terraform/scripts/discover_gateway_imports.py '${PROJECT_ID}' '${_REGION}'
        '${_NETWORK_NAME}' '${_APP_SUBNET_CIDR}' '${_PROXY_SUBNET_CIDR}' > /workspace/gateway-imports

  - name: 'hashicorp/terraform:1.12.2'
    id: 'import-existing-gateway'
    entrypoint: 'sh'
    dir: 'terraform/agent_gateway_resources'
    args: ['../scripts/import_gateway_state.sh', '/workspace/gateway-imports', '${PROJECT_ID}', '${_REGION}', '${_NETWORK_NAME}', '${_APP_SUBNET_CIDR}', '${_PROXY_SUBNET_CIDR}']

  # Step 2: Run Terraform Apply
  - name: 'hashicorp/terraform:1.12.2'
    id: 'tf-apply'
    args:
      - 'apply'
      - '-lock-timeout=5m'
      - '-var=project_id=${PROJECT_ID}'
      - '-var=main_region=${_REGION}'
      - '-var=network_name=${_NETWORK_NAME}'
      - '-var=app_subnet_cidr=${_APP_SUBNET_CIDR}'
      - '-var=proxy_only_subnet_cidr=${_PROXY_SUBNET_CIDR}'
      - '-auto-approve'
    dir: 'terraform/agent_gateway_resources'

serviceAccount: 'projects/${PROJECT_ID}/serviceAccounts/${_SA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY
