substitutions:
  _LOCATION: us-central1
  _REPO_NAME: mcp-servers
steps:
- name: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  id: ui-regressions
  args:
  - -ec
  - uv run --group backend --group frontend --group dev pytest ui/tests terraform/tests
    -q
  entrypoint: sh
- name: hashicorp/terraform:1.12.2
  id: ui_frontend-init
  args:
  - -ec
  - terraform init -backend-config="bucket=${PROJECT_ID}-terraform-state" -backend-config="prefix=terraform/state/ui-frontend-resources"
  dir: terraform/ui_frontend_resources
  entrypoint: sh
- name: hashicorp/terraform:1.12.2
  id: frontend-fmt
  args:
  - fmt
  - -check
  dir: terraform/ui_frontend_resources
- name: hashicorp/terraform:1.12.2
  id: frontend-validate
  args:
  - validate
  dir: terraform/ui_frontend_resources
- name: gcr.io/cloud-builders/docker
  id: frontend-build
  args:
  - build
  - -t
  - ${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/ui-frontend:${COMMIT_SHA}
  - -f
  - ui/frontend/Dockerfile
  - .
serviceAccount: projects/${PROJECT_ID}/serviceAccounts/${_SA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
