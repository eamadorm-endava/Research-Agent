substitutions:
  _LOCATION: us-central1
  _REPO_NAME: mcp-servers
  _SERVICE_NAME: ui-frontend

steps:
  # Step 1: Docker Build for Test
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-build'
    args: [
      'build', 
      '-t', '${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:test-${COMMIT_SHA}', 
      '-f', 'ui/frontend/Dockerfile', 
      '.'
    ]

  # Step 2: Docker Push
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-push'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        docker push ${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:test-${COMMIT_SHA}

  # Step 3: Deploy Test Instance (Ephemeral)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-test'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BACKEND_URL=$$(gcloud run services describe test-ui-backend --region=${_LOCATION} --format='value(status.url)')
        gcloud services enable iap.googleapis.com --project=${PROJECT_ID}
        gcloud beta services identity create --service=iap.googleapis.com --project=${PROJECT_ID}
        gcloud run deploy test-${_SERVICE_NAME} \
          --image=${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:test-${COMMIT_SHA} \
          --region=${_LOCATION} \
          --platform=managed \
          --no-allow-unauthenticated \
          --ingress=internal-and-cloud-load-balancing \
          --service-account=osiris-ui-frontend@${PROJECT_ID}.iam.gserviceaccount.com \
          --network=mcp-agent-vpc \
          --subnet=mcp-agent-vpc-app-subnet-${_LOCATION} \
          --vpc-egress=all-traffic \
          --set-env-vars="API_URL=$${BACKEND_URL}/api,PUBLIC_BASE_URL=https://test.osiris.endava.app" \
          --quiet
        PROJECT_NUMBER=$$(gcloud projects describe ${PROJECT_ID} --format='value(projectNumber)')
        gcloud run services add-iam-policy-binding test-${_SERVICE_NAME} \
          --region=${_LOCATION} --role=roles/run.invoker \
          --member="serviceAccount:service-$${PROJECT_NUMBER}@gcp-sa-iap.iam.gserviceaccount.com" --quiet

  # Step 4: Initialize Terraform
  - name: 'hashicorp/terraform:1.12.2'
    id: 'tf-init'
    env:
      - 'TF_REGISTRY_CLIENT_TIMEOUT=60'
      - 'TF_REGISTRY_DISCOVERY_RETRY=3'
    entrypoint: 'sh'
    dir: 'terraform/ui_frontend_resources'
    args:
      - '-c'
      - |
        terraform init \
          -backend-config="bucket=${PROJECT_ID}-terraform-state" \
          -backend-config="prefix=terraform/state/ui-frontend-resources"

  # Step 5: Full Terraform Plan
  - name: 'hashicorp/terraform:1.12.2'
    id: 'tf-plan'
    args:
      - 'plan'
      - '-var=project_id=${PROJECT_ID}'
      - '-var=main_region=${_LOCATION}'
    dir: 'terraform/ui_frontend_resources'

serviceAccount: 'projects/${PROJECT_ID}/serviceAccounts/${_SA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY
