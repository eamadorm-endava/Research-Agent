substitutions:
  _LOCATION: us-central1

steps:
  # Step 1: Initialize Terraform with Dynamic Backend
  - name: 'hashicorp/terraform:1.12.2'
    id: 'tf-init'
    entrypoint: 'sh'
    dir: 'terraform/shared_resources'
    args:
      - '-c'
      - |
        terraform init \
          -backend-config="bucket=${PROJECT_ID}-terraform-state" \
          -backend-config="prefix=terraform/state/shared-resources"

  # The provisioner needs Cloud SDK (bq) and bash in the same container as Terraform.
  - name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:stable'
    id: 'tf-apply'
    entrypoint: 'bash'
    dir: 'terraform/shared_resources'
    args:
      - '-ceu'
      - |
        SSL_CERT_FILE=/usr/lib/google-cloud-sdk/lib/third_party/certifi/cacert.pem /usr/lib/google-cloud-sdk/platform/bundledpythonunix/bin/python3 -c "import urllib.request, zipfile; urllib.request.urlretrieve('https://releases.hashicorp.com/terraform/1.12.2/terraform_1.12.2_linux_amd64.zip', '/tmp/terraform.zip'); zipfile.ZipFile('/tmp/terraform.zip').extract('terraform', '/usr/local/bin')"
        chmod +x /usr/local/bin/terraform
        terraform apply -auto-approve -lock-timeout=5m \
          -var=project_id=${PROJECT_ID} -var=main_region=${_LOCATION}

serviceAccount: 'projects/${PROJECT_ID}/serviceAccounts/${_SA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY
